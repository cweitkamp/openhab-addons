addon.gruenstromindex.description = This is the binding for GrünstromIndex.

# thing types

thing-type.gruenstromindex.account.label = GrünstromIndex Account
thing-type.gruenstromindex.account.description = Provides access to the GrünstromIndex API.
thing-type.gruenstromindex.green-energy-forecast.label = Green Energy Forecast
