# add-on

addon.homematicip.name = homematic IP Binding
addon.homematicip.description = This is the binding for homematic IP devices.

# thing types

thing-type.homematicip.access-point.label = Access Point
thing-type.homematicip.access-point.description = homematic IP Access Point (HmIP-HAP). Connects the smartphone with all homematic IP devices.
thing-type.homematicip.energy-sensors-interface.label = Energy Sensor Interface
thing-type.homematicip.energy-sensors-interface.description = An interface for smart meter (e.g. HmIP-ESI-IEC). Acquires all meter readings and the latest consumption data from the electricity meter.
thing-type.homematicip.gas-sensors-interface.label = Energy Sensor Interface
thing-type.homematicip.gas-sensors-interface.description = An interface for gas meter (e.g. HmIP-ESI-GAS). Acquires all meter readings and the latest consumption data from the gas meter.
thing-type.homematicip.heating-group.label = Heating Group
thing-type.homematicip.heating-group.description = A heating group (e.g. a room). Controls the room according to the individual needs of a user.
thing-type.homematicip.outlet.label = Pluggable Switch and Meter
thing-type.homematicip.outlet.description = A pluggable switch and meter (e.g. HmIP-PSM-2). Enables switching of connected devices and metering of energy consumption.
thing-type.homematicip.presence-sensor.label = Presence Sensor
thing-type.homematicip.presence-sensor.description = A presence sensor (e.g. HmIP-SPI). Detects smallest movements and ambient brightness.
thing-type.homematicip.shutter-contact.label = Window / Door Contact
thing-type.homematicip.shutter-contact.description = A window / door contact (e.g. HmIP-SWDM or HmIP-SWDO-I). Detects opening and closing of windows and doors.
thing-type.homematicip.thermostat-evo.label = Radiator Thermostat Evo
thing-type.homematicip.thermostat-evo.description = A radiator thermostat (e.g. HmIP-eTRV-E). Controls the radiator according to the individual needs of a user.
thing-type.homematicip.thermostat.label = Radiator Thermostat
thing-type.homematicip.thermostat.description = A radiator thermostat (e.g. HmIP-eTRV-2). Controls the radiator according to the individual needs of a user.
thing-type.homematicip.underfloor-heating-actuator.label = Floor Heating Controller
thing-type.homematicip.underfloor-heating-actuator.description = An floor heating controller - 12 channels, motorised (e.g. HmIP-FALMOT-C12). Latest control technology for floor heating systems through continuous and energy-efficient control of motorised valve drives.
thing-type.homematicip.wall-mounted-thermostat.label = Wall Thermostat
thing-type.homematicip.wall-mounted-thermostat.description = A wall thermostat with humidity sensor(e.g. HmIP-WTH-2). Time-controlled regulation of the room temperature.

