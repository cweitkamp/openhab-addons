# add-on

addon.homematicip.name = homematic IP Binding
addon.homematicip.description = Binding zur Anbindung und Steuerung von homematic IP Komponenten.

# thing types

thing-type.homematicip.access-point.label = Access Point
thing-type.homematicip.access-point.description = homematic IP Access Point (HmIP-HAP). Verbindet das Smartphone mit den homematic IP Geräten.
thing-type.homematicip.energy-sensors-interface.label = Schnittstelle für Smart Meter
thing-type.homematicip.energy-sensors-interface.description = Eine Schnittstelle für Smart Meter (z.B. HmIP-ESI-IEC). Erfasst alle Zählerstände und den aktuellen Verbrauch des Stromzählers.
thing-type.homematicip.gas-sensors-interface.label = Schnittstelle für Gaszähler
thing-type.homematicip.gas-sensors-interface.description = Eine Schnittstelle für Gaszähler (e.g. HmIP-ESI-GAS). Erfasst alle Zählerstände und den aktuellen Verbrauch des Gaszählers.
thing-type.homematicip.heating-group.label = Heizgruppe
thing-type.homematicip.heating-group.description = Eine Heizgruppe (z.B. ein Raum). Steuert den Raum nach individuellen Bedürfnissen.
thing-type.homematicip.outlet.label = Schalt-Mess-Steckdose
thing-type.homematicip.outlet.description = homematic IP Schalt-Mess-Steckdose (z.B. HmIP-PSM-2). Schaltet angeschlossene Verbraucher und misst den Energieverbrauch.
thing-type.homematicip.presence-sensor.label = Präsenzmelder
thing-type.homematicip.presence-sensor.description = Ein Präsenzmelder (z.B. HmIP-SPI). Erfasst feinste Bewegungen und misst die Helligkeit.
thing-type.homematicip.shutter-contact.label = Fenster- und Türkontakt
thing-type.homematicip.shutter-contact.description = homematic IP Fenster- und Türkontakt (z.B. HmIP-SWDM oder HmIP-SWDO-I). Erkennt das Öffnen und Schließen von Fenstern oder Türen.
thing-type.homematicip.thermostat-evo.label = Heizkörperthermostat Evo
thing-type.homematicip.thermostat-evo.description = homematic IP Heizkörperthermostat Evo (z.B. HmIP-eTRV-E). Steuert den Heizkörper nach individuellen Bedürfnissen.
thing-type.homematicip.thermostat.label = Heizkörperthermostat
thing-type.homematicip.thermostat.description = homematic IP Heizkörperthermostat (z.B. HmIP-eTRV-2). Steuert den Heizkörper nach individuellen Bedürfnissen.
thing-type.homematicip.underfloor-heating-actuator.label = Fußbodenheizungskontroller
thing-type.homematicip.underfloor-heating-actuator.description = homematic IP Fußbodenheizungskontroller - 12 Kanäle, motorisch (z.B. HmIP-FALMOT-C12). Modernste Regelungstechnik für Fußbodenheizungen durch stufenlose und energieeffiziente Steuerung motorischer Stellantriebe.
thing-type.homematicip.wall-mounted-thermostat.label = Wandthermostat
thing-type.homematicip.wall-mounted-thermostat.description = homematic IP Wandthermostat mit Luftfeuchtigkeitssensor (z.B. HmIP-WTH-2). Zeitgesteuertes Regeln der Raumtemperatur.

